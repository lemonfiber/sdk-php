# Tell the companion when the client it locks has moved.
#
# `lemonfiber-companion` reaches a stack through this package and through nothing
# else — its `ARCHITECTURE.md` says so, and its `sdk` module is the only adapter
# allowed to name it. It takes this package as `dev-main`, so `composer.lock`
# pins an exact commit and `composer install` is content with one from any point
# in the past.
#
# So a fix here is not a fix there until somebody moves that reference, and
# nothing there was watching. The companion was created with its lock three
# commits behind this repository, drawn through a contract that did not have the
# field saying what a reversal did *not* put back, and every check it ran passed.
#
# Its `sdk-drift` check now compares the two, but on a weekly schedule. This
# fires on the change instead of on the calendar, and asks the companion to
# *take* this main rather than to judge its lock: asking for the verdict only
# produces a red required check that whoever next opens a pull request has to
# clear, about anything. `sdk-bump` there opens the bump instead.
#
# Every commit on main counts. What the companion gets is generated envelopes, a
# transport and a vendored contract, and there is no subset of this repository
# that leaves all three alone — so this is not filtered by path.
name: sdk-moved

on:
  push:
    branches: [main]
  # Kept so the notifier can be driven against a real change rather than trusted.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tell:
    permissions:
      contents: read
    uses: lemonfiber/spec/.github/workflows/tell.yml@579dd00118f557a9ff703c988a0648012b828bed # v1.0.98
    with:
      repos: lemonfiber-companion
      workflow: sdk-bump.yml
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
