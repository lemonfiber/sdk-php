name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          #
          # Under `.github/`, only this file runs the PHP gates, so a change to
          # any other file there starts none of them. A change to this file
          # starts none of them either where every line it changes is a pin
          # on a shared workflow from `lemonfiber/spec`: those jobs run no PHP.
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | docs/* | *.md | LICENSE) ;;
            .github/workflows/ci.yml)
              # Every changed line that is not a pin, read to the end. A
              # `grep -q` here stops at the first such line, the writers before
              # it die of SIGPIPE, and `pipefail` turns that into "no such
              # line": a change to how the gates run would skip them.
              moved="$(git diff -U0 "${BASE}" HEAD -- "${path}" \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[-+][[:space:]]*uses: lemonfiber/spec/\.github/workflows/[^@]+@[0-9a-f]{40}( # .*)?$' || true)"
              if [ -n "${moved}" ]; then
                code=true
              fi
              ;;
            .github/*) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Documentation, and workflows that run no PHP gate; the PHP gates are skipped."
          fi

  # The gates every repo in the org shares, defined once in the spec repo and
  # pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  commitlint:
    if: github.event_name == 'pull_request'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  # OPS-R39, OPS-R40, OPS-R42: label a PR that cites a goal the staged version
  # locks, put it in that version's milestone, comment which goals it moves, and
  # route one citing only out-of-scope requirements to the next version.
  #
  # This repository satisfies goals — `0.10.0`, `0.16.0` and `0.17.0` each name
  # it in `satisfied_in` — and OPS-R39 is written about a pull request rather
  # than about a repository, so a PR here citing a locked goal is one the rule
  # already covers. It was never labelled because the workflow was never called,
  # which is a silence rather than an exemption.
  #
  # Gated on the event like `labeler` above: this workflow also runs on push,
  # where there is no pull request to label.
  #
  # `issues: write` is what the milestone half needs: a milestone is an
  # issues-API object even when it sits on a pull request, and granting less
  # gets the label and a warning instead.
  goals:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: lemonfiber/spec/.github/workflows/goal-automations.yml@c26ed83df4ecfeb0b1a2d4e565011605b67c648b # v1.0.38

  # Formatting, static analysis, dead idioms, the repository's guards, the
  # contract diff and dependency hygiene. One checkout, one PHP, one install.
  #
  # These were seven jobs, and each paid for that preamble before doing about
  # fifteen seconds of work — the preamble was most of the bill. Ordered
  # cheapest first, so a misplaced brace fails in seconds rather than after the
  # analyser has walked the tree.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contract page lives in the spec and this repo does not vendor it, so
      # the one check that reads both trees needs both trees. Same repository,
      # same ref and same path `lemonfiber` uses for its half of the check, for
      # one answer to where the canonical spec is.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      # Before the toolchain, which it needs none of: a read the contract page
      # names and this client cannot reach is worth saying in the first minute
      # rather than after an install.
      - name: This client holds a path for every read the contract names
        run: python3 scripts/the_doors_this_client_names.py --spec .spec-canonical
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: composer lint
      - run: php scripts/guards.php
      - run: composer analyse
      - run: composer refactor
      - run: composer contract:check
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:coverage

  # Which shards of `src` there are, asked of the same script that mutates
  # them. A list written into this file would be a second source of truth, and
  # it would go stale the day a directory is added — silently, since the run
  # still passes, over less.
  #
  # The script reads the tree and nothing else, so this job installs nothing
  # and answers in seconds.
  mutation-scope:
    name: what to mutate
    needs: scope
    # The guard every gate above carries, for the reasons written on `checks`:
    # a `scope` that failed leaves no output, and no output is not a "no".
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - id: list
        run: echo "shards=$(php scripts/mutation.php --list)" >> "$GITHUB_OUTPUT"

  # The most expensive gate here, so the most guarded: only on a pull request,
  # and only once the tests have passed. Mutating code whose tests already fail
  # measures nothing.
  #
  # A runner per shard, which is a top-level directory of `src`. The work
  # separates because the floor is 100: a score of 100 over a set of files is a
  # score of 100 over every part of it, so a shard is judged exactly as it would
  # have been inside a whole run, and no shard can carry another. What was the
  # sum of every file's mutants in one process is now the slowest single shard.
  #
  # `fail-fast: false`, since the point of a shard is to learn about all of
  # them: cancelling six runners over one escaped mutant means another push to
  # find the next one.
  mutation:
    name: mutation
    needs: [tests, mutation-scope]
    if: ${{ !cancelled() && needs.tests.result == 'success' && needs.mutation-scope.result == 'success' && needs.mutation-scope.outputs.shards != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.mutation-scope.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:mutation -- --shard=${{ matrix.shard }}

  # The check branch protection names.
  #
  # A matrix job reports one check per entry — `mutation (Http)`,
  # `mutation (Events)` — and not one of them is called `mutation testing`.
  # That required check would simply never report, and a required check that
  # never reports blocks every pull request with nothing anywhere naming the
  # cause. It is the hole `sonar.yml`'s gate exists to close, reached here by a
  # rename rather than by a failure.
  #
  # So this job keeps the name the shards lost and answers for them.
  # `!cancelled()` rather than `always()`: a cancelled run is somebody pressing
  # stop. It asks their results rather than only depending on them, for the
  # reason the gates above ask `scope`'s — `needs` alone makes a job disappear
  # when what it needs fails, which turns a red gate into a missing one.
  mutation-gate:
    name: mutation testing
    needs: [scope, tests, mutation-scope, mutation]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every shard that was mutated passed
        env:
          TESTS: ${{ needs.tests.result }}
          LISTING: ${{ needs.mutation-scope.result }}
          SHARDS: ${{ needs.mutation.result }}
          LIST: ${{ needs.mutation-scope.outputs.shards }}
        run: |
          echo "tests=${TESTS} listing=${LISTING} shards=${SHARDS} list=${LIST}"

          if [ "${TESTS}" != success ] || [ "${LISTING}" != success ]; then
            echo "::error::Mutation did not run: the tests or the shard list did not pass."
            exit 1
          fi

          # `skipped` is a pass here and only here: the matrix is skipped when
          # there is no shard to run at all, which `what to mutate` reports as
          # an empty list. A skip with shards named behind it is a matrix that
          # never started, and that is a gate which mutated nothing rather than
          # one that found nothing wrong.
          if [ "${SHARDS}" = skipped ] && [ "${LIST}" != "[]" ]; then
            echo "::error::No shard ran, and ${LIST} were listed to run."
            exit 1
          fi

          if [ "${SHARDS}" != success ] && [ "${SHARDS}" != skipped ]; then
            echo "::error::A shard's mutation run did not pass. Open the mutation (<shard>) job that is red."
            exit 1
          fi

  # A library's promise to its consumers, checked against the commit its consumer pins.
  # Kept on its own because it needs the full history and a second install of
  # its own tooling.
  backward-compatibility:
    name: backward compatibility
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Nothing is released, so what a breaking change breaks is the commit the
      # companion pins: the one its main branch's lockfile holds, which the
      # release train moves. That commit is what this pull request is compared
      # against. A pin that cannot be read is a failure rather than a pass: a
      # check that compared nothing reads exactly like one that found nothing.
      - name: Find the commit the companion pins
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock="$(gh api repos/lemonfiber/lemonfiber-companion/contents/composer.lock -H 'Accept: application/vnd.github.raw')"
          pin="$(printf '%s' "${lock}" | jq -r '[.packages[], (.["packages-dev"] // [])[]] | map(select(.name == "lemonfiber/sdk-php")) | first | .source.reference // empty')"
          if [ -z "${pin}" ]; then
            echo "::error::The companion's lockfile names no commit of lemonfiber/sdk-php, so there is nothing to compare against."
            exit 1
          fi
          if ! git cat-file -e "${pin}^{commit}" 2>/dev/null; then
            echo "::error::The companion pins ${pin}, which is not a commit of this repository."
            exit 1
          fi
          echo "Comparing against ${pin}, the commit the companion's main branch pins."
          echo "commit=${pin}" >> "$GITHUB_OUTPUT"
      - name: Install the checker
        run: composer bin bc install --no-interaction
      # What this pull request breaks is what its head breaks against the pin and
      # its base does not: a break already on main is the release train's to
      # carry to the companion, and is not this pull request's. A break the pull
      # request declares, with `!` in its title as conventional commits write
      # one, is reported and allowed, and the squashed commit carries the title.
      - name: Compare against the pinned commit
        env:
          PINNED: ${{ steps.pinned.outputs.commit }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          check=vendor-bin/bc/vendor/bin/roave-backward-compatibility-check
          "${check}" --from="${PINNED}" --to="${BASE}" > "${RUNNER_TEMP}/base.out" 2>&1 || true
          "${check}" --from="${PINNED}" > "${RUNNER_TEMP}/head.out" 2>&1 || true
          # Each run ends on its verdict. One that did not reach it compared
          # nothing, and nothing compared is not nothing broken.
          for run in base head; do
            verdict="$(grep -E 'backwards-incompatible changes detected' "${RUNNER_TEMP}/${run}.out" || true)"
            if [ -z "${verdict}" ]; then
              cat "${RUNNER_TEMP}/${run}.out"
              echo "::error::The comparison of the ${run} against ${PINNED} did not finish."
              exit 1
            fi
            { grep '^\[BC\]' "${RUNNER_TEMP}/${run}.out" || true; } | sort -u > "${RUNNER_TEMP}/${run}.txt"
          done
          added="$(comm -13 "${RUNNER_TEMP}/base.txt" "${RUNNER_TEMP}/head.txt")"
          if [ -z "${added}" ]; then
            echo "Nothing breaks against ${PINNED} that main did not already break."
            exit 0
          fi
          printf '%s\n' "${added}"
          declared="$(printf '%s\n' "${TITLE}" | grep -E '^[a-z]+(\([a-z0-9.-]+\))?!: ' || true)"
          if [ -n "${declared}" ]; then
            echo "::notice::This pull request breaks what the companion pins, and its title says so."
            exit 0
          fi
          echo "::error::This breaks what the companion pins. Declare it with '!' in the title (for example 'feat!: ...') and route the companion's side, or keep the old surface."
          exit 1
