name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          #
          # Under `.github/`, only this file runs the PHP gates, so a change to
          # any other file there starts none of them. A change to this file
          # starts none of them either where every line it changes is a pin
          # on a shared workflow from `lemonfiber/spec`: those jobs run no PHP.
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | docs/* | *.md | LICENSE) ;;
            .github/workflows/ci.yml)
              # Every changed line that is not a pin, read to the end. A
              # `grep -q` here stops at the first such line, the writers before
              # it die of SIGPIPE, and `pipefail` turns that into "no such
              # line": a change to how the gates run would skip them.
              moved="$(git diff -U0 "${BASE}" HEAD -- "${path}" \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[-+][[:space:]]*uses: lemonfiber/spec/\.github/workflows/[^@]+@[0-9a-f]{40}( # .*)?$' || true)"
              if [ -n "${moved}" ]; then
                code=true
              fi
              ;;
            .github/*) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Documentation, and workflows that run no PHP gate; the PHP gates are skipped."
          fi

  # Formatting, static analysis, dead idioms, the repository's guards, the
  # contract diff and dependency hygiene. One checkout, one PHP, one install.
  #
  # These were seven jobs, and each paid for that preamble before doing about
  # fifteen seconds of work — the preamble was most of the bill. Ordered
  # cheapest first, so a misplaced brace fails in seconds rather than after the
  # analyser has walked the tree.
  checks:
    name: checks
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contract page lives in the spec and this repo does not vendor it, so
      # the one check that reads both trees needs both trees. Same repository,
      # same ref and same path `lemonfiber` uses for its half of the check, for
      # one answer to where the canonical spec is.
      - name: Check out the canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/spec
          ref: main
          path: .spec-canonical
          persist-credentials: false
      # Before the toolchain, which it needs none of: a read the contract page
      # names and this client cannot reach is worth saying in the first minute
      # rather than after an install.
      - name: This client holds a path for every read the contract names
        run: python3 scripts/the_doors_this_client_names.py --spec .spec-canonical
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: composer lint
      - run: php scripts/guards.php
      - run: composer analyse
      - run: composer refactor
      - run: composer contract:check
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:coverage

  # Every mutant of `src` is killed: the floor `mutation-gate.json` gives the
  # tree is 100, and new code is held at 100 too. The gate is
  # nightworksio/php-mutation-gate, at the commit composer.lock installs and
  # this call pins, and both move together by pull request.
  #
  # Its reusable workflow plans the run, mutates each shard in its own job and
  # judges them in `mutation / verdict`, which is the check branch protection
  # names. It runs on every pull request, the documentation-only ones included,
  # because a required check from a called workflow reports under the caller's
  # name only when the caller runs: on a change without code the plan finds
  # nothing to mutate and the verdict passes. A pull request whose tests fail
  # starts no mutation; its red is `tests and coverage`'s.
  #
  # The grants below are ceilings, not the token any job gets: each job of the
  # called workflow declares its own permissions, the ones that run this
  # repository's code read only, and GitHub refuses to start a called
  # workflow whose jobs ask for more than its caller grants. The branch
  # `mutation-gate` that publish writes holds the badge and the trend.
  mutation:
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    permissions:
      contents: write # used only by publish, on main, which writes the badge and the trend
      actions: read # used only by verdict and deliver, to find the run's HTML report the comment links
      pull-requests: write # used only by the deliver jobs, which post the comment and run none of this repository's code
      id-token: write # used only by fetch and deliver, for a store that signs in through OIDC; this repository names none
    uses: nightworksio/php-mutation-gate/.github/workflows/mutation-gate.yml@0d79c92b50a3fefb42d1c91f304b2e97301e1eca # main
    with:
      php-version: '8.5'

  # A library's promise to its consumers, checked against the commit its consumer pins.
  # Kept on its own because it needs the full history and a second install of
  # its own tooling.
  backward-compatibility:
    name: backward compatibility
    needs: scope
    # `scope` deciding "no code changed" is a skip, and the gates are scoped so
    # that a documentation change does not start a PHP toolchain. `scope`
    # *failing* produces the same skip — a checkout that broke or a runner that
    # died leaves no output, and no output is not a "no".
    #
    # Either way that is wrong. If a skipped required check satisfies branch
    # protection, a pull request merges with none of these run and nothing red.
    # If it does not, the check never reports and the pull request is blocked
    # forever with nothing anywhere naming the cause. The job's own comments say
    # which way it means to fail — "No usable base commit, so every gate runs" —
    # and its own failure was the one path that did the opposite.
    #
    # So the condition asks the result as well as the output.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Nothing is released, so what a breaking change breaks is the commit the
      # companion pins: the one its main branch's lockfile holds, which the
      # release train moves. That commit is what this pull request is compared
      # against. A pin that cannot be read is a failure rather than a pass: a
      # check that compared nothing reads exactly like one that found nothing.
      - name: Find the commit the companion pins
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock="$(gh api repos/lemonfiber/lemonfiber-companion/contents/composer.lock -H 'Accept: application/vnd.github.raw')"
          pin="$(printf '%s' "${lock}" | jq -r '[.packages[], (.["packages-dev"] // [])[]] | map(select(.name == "lemonfiber/sdk-php")) | first | .source.reference // empty')"
          if [ -z "${pin}" ]; then
            echo "::error::The companion's lockfile names no commit of lemonfiber/sdk-php, so there is nothing to compare against."
            exit 1
          fi
          if ! git cat-file -e "${pin}^{commit}" 2>/dev/null; then
            echo "::error::The companion pins ${pin}, which is not a commit of this repository."
            exit 1
          fi
          echo "Comparing against ${pin}, the commit the companion's main branch pins."
          echo "commit=${pin}" >> "$GITHUB_OUTPUT"
      - name: Install the checker
        run: composer bin bc install --no-interaction
      # What this pull request breaks is what its head breaks against the pin and
      # its base does not: a break already on main is the release train's to
      # carry to the companion, and is not this pull request's. A break the pull
      # request declares, with `!` in its title as conventional commits write
      # one, is reported and allowed, and the squashed commit carries the title.
      - name: Compare against the pinned commit
        env:
          PINNED: ${{ steps.pinned.outputs.commit }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          check=vendor-bin/bc/vendor/bin/roave-backward-compatibility-check
          "${check}" --from="${PINNED}" --to="${BASE}" > "${RUNNER_TEMP}/base.out" 2>&1 || true
          "${check}" --from="${PINNED}" > "${RUNNER_TEMP}/head.out" 2>&1 || true
          # Each run ends on its verdict. One that did not reach it compared
          # nothing, and nothing compared is not nothing broken.
          for run in base head; do
            verdict="$(grep -E 'backwards-incompatible changes detected' "${RUNNER_TEMP}/${run}.out" || true)"
            if [ -z "${verdict}" ]; then
              cat "${RUNNER_TEMP}/${run}.out"
              echo "::error::The comparison of the ${run} against ${PINNED} did not finish."
              exit 1
            fi
            { grep '^\[BC\]' "${RUNNER_TEMP}/${run}.out" || true; } | sort -u > "${RUNNER_TEMP}/${run}.txt"
          done
          added="$(comm -13 "${RUNNER_TEMP}/base.txt" "${RUNNER_TEMP}/head.txt")"
          if [ -z "${added}" ]; then
            echo "Nothing breaks against ${PINNED} that main did not already break."
            exit 0
          fi
          printf '%s\n' "${added}"
          declared="$(printf '%s\n' "${TITLE}" | grep -E '^[a-z]+(\([a-z0-9.-]+\))?!: ' || true)"
          if [ -n "${declared}" ]; then
            echo "::notice::This pull request breaks what the companion pins, and its title says so."
            exit 0
          fi
          echo "::error::This breaks what the companion pins. Declare it with '!' in the title (for example 'feat!: ...') and route the companion's side, or keep the old surface."
          exit 1
