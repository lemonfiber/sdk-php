name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  # Which of the following are worth running at all. A documentation change
  # should not start a PHP toolchain, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          # No base to compare against means run everything rather than guess.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so every gate runs."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE}" HEAD)"
          # Anything that is not documentation is treated as code. The list is
          # deliberately short: a new kind of file defaults to running the gates.
          if printf '%s\n' "${changed}" | grep -qvE '^(docs/|[^/]*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only; the PHP gates are skipped."
          fi

  # The gates every repo in the org shares, defined once in the spec repo and
  # pinned by commit. Those needing a pull request are guarded, because this
  # workflow also runs on pushes to main.
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  commitlint:
    if: github.event_name == 'pull_request'
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  # Formatting, static analysis, dead idioms, the repository's guards, the
  # contract diff and dependency hygiene. One checkout, one PHP, one install.
  #
  # These were seven jobs, and each paid for that preamble before doing about
  # fifteen seconds of work — the preamble was most of the bill. Ordered
  # cheapest first, so a misplaced brace fails in seconds rather than after the
  # analyser has walked the tree.
  checks:
    name: checks
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .phpstan-cache
            .rector-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: composer lint
      - run: php scripts/guards.php
      - run: composer analyse
      - run: composer refactor
      - run: composer contract:check
      - run: composer deps
      - run: composer audit

  tests:
    name: tests and coverage
    needs: scope
    if: needs.scope.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:coverage

  # The most expensive gate here, so the most guarded: only on a pull request,
  # and only once the tests have passed. Mutating code whose tests already fail
  # measures nothing.
  mutation:
    name: mutation testing
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:mutation

  # A library's promise to its consumers, checked against the last release.
  # Kept on its own because it needs the full history and a second install of
  # its own tooling.
  backward-compatibility:
    name: backward compatibility
    needs: scope
    if: needs.scope.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Find the last released version
        id: released
        run: |
          latest="$(git tag --list --sort=-v:refname 'v*' | head -n 1)"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          # A job that skips its only two steps still reports success, and a green
          # check that compared nothing reads exactly like one that compared and
          # found nothing wrong. Say which this was.
          if [ -z "${latest}" ]; then
            echo "::notice::No released version to compare against, so backward compatibility is not being enforced on this run."
          else
            echo "Comparing against ${latest}."
          fi
      - name: Install the checker
        if: steps.released.outputs.tag != ''
        run: composer bin bc install --no-interaction
      - name: Compare against the last release
        if: steps.released.outputs.tag != ''
        run: composer bc
