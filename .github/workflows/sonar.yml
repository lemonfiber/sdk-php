# Gate this repo's PRs on zero new SonarCloud issues.
#
# The scan is SonarCloud Automatic Analysis against `lemonfiber_sdk-php`;
# there is no scan job here. This reads the summary that analysis posts and
# enforces the standard the free plan's own quality gate cannot (Q-R64),
# through the shared reusable in spec so every repo gates identically.
name: sonar
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@93bf49c96ae5b12e49daea523b1d66ae294babb0 # main
    with:
      allowed-open: 3
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
