# Take the contract, so that nobody else has to.
#
# `contract-drift` runs on every pull request here and compares the vendored
# artefact against what the server serves. That is right and it is what `Q-R68`
# asks for, but it has a cost nothing was paying down: a contract change turns
# every open pull request here red, including ones that touch nothing near it.
# An author who came to fix a comment is handed a contract sync.
#
# `contract-moved` in lemonfiber already fires on the artefact changing, and
# what it asked for was the *verdict* — which only ever produced a red check
# somebody else had to clear, and because `contract-drift` runs on pull requests
# that somebody was whoever next opened one, about anything. This is the same
# arrangement `lemonfiber-web` and its client already have: ask for the catch-up
# rather than for the diagnosis.
#
# It merges itself only when the regeneration is clean. A contract that changes
# a shape this package exports is a change here rather than a bump, and that is
# not a thing to merge unread.
name: contract-bump

on:
  # How the server asks. `contract-moved` there dispatches this whenever the
  # contract artefact changes, so the cadence is the change rather than the
  # calendar.
  workflow_dispatch:
  # The floor, for a dispatch that never arrived.
  schedule:
    - cron: "50 7 * * 1"

permissions:
  contents: read

concurrency:
  # One catch-up at a time, and the newest wins. Two runs racing would each
  # reset the branch under the other, and a run still in flight when the server
  # moves again is building a catch-up the next run replaces, so it is cancelled
  # rather than left to push a head whose checks nobody will read.
  #
  # A run cancelled at any step leaves nothing the next one cannot finish. The
  # scratch ref is reset before it is used and deleted by whichever run gets
  # past it; the branch moves in one call or not at all; and a pull request left
  # unopened or unarmed is not what the next run treats as already carried, so
  # that run pushes and opens or arms it.
  group: contract-bump
  cancel-in-progress: true

env:
  BRANCH: chore/the-client-takes-the-contract
  SERVER: lemonfiber/lemonfiber
  PHP_VERSION: '8.5'

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # The commit has to be signed — `main` requires it — and a commit made
      # with the workflow's own token is not. Minting an app token also means
      # the pull request's checks actually run: one opened by `GITHUB_TOKEN`
      # triggers no workflows, so its required checks would never report and it
      # could never merge. Both reasons point at the same token.
      - name: Mint a token that can open a pull request here
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is the vendored artefact behind at all
        id: behind
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # The artefact decides, not the revision.
          #
          # `contract/VERSION` records which commit the vendored bytes came
          # from, and the server's main moves for every commit — a README, a
          # workflow, a test. Comparing the two says "behind" on all of them,
          # and each would open a pull request whose only change is the
          # revision stamp. That is the noise this workflow exists to remove,
          # arriving from the other direction.
          #
          # So this compares what `contract-drift` compares, with the same
          # script: the parsed artefact. When it matches, there is nothing to
          # take, and the stamp staying where it is remains true — it says
          # where the bytes came from, and they came from there.
          pin="$(tr -d '[:space:]' < contract/VERSION)"
          head="$(gh api "repos/${SERVER}/commits/main" --jq .sha)"
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"

          # The archive of the revision's tree holds the contract in whichever
          # layout that revision has it. `-L` follows redirects, and a redirect
          # may point anywhere. These refuse any hop that is not HTTPS, so what
          # is fetched cannot be downgraded.
          curl -fsSL --proto "=https" --proto-redir "=https" --retry 3 -o lemonfiber.tar.gz \
            "https://codeload.github.com/${SERVER}/tar.gz/${head}"

          # Exit 0 is the same contract, 1 a different one, and anything else
          # a copy that could not be read, which is neither.
          compared=0
          python3 scripts/contract_drift.py || compared=$?
          rm -f lemonfiber.tar.gz

          case "$compared" in
            0)
              echo "moved=no" >> "$GITHUB_OUTPUT"
              echo "The vendored artefact matches the one ${head} serves; nothing to take."
              echo "## The vendored contract is what the server describes" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
              ;;
            1)
              echo "moved=yes" >> "$GITHUB_OUTPUT"
              echo "The artefact has changed since ${pin}; the server's main is ${head}."
              ;;
            *)
              echo "::error::the vendored contract and the one ${head} serves could not be compared"
              exit 1
              ;;
          esac

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.behind.outputs.moved == 'yes'
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        if: steps.behind.outputs.moved == 'yes'

      - name: Take the contract and regenerate against it
        id: build
        if: steps.behind.outputs.moved == 'yes'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.behind.outputs.head }}
        run: |
          set -euo pipefail
          # The one step in this package that touches the network. Generation
          # reads the vendored copy, which is what keeps a build offline.
          composer contract:sync -- "${HEAD_SHA}"
          composer contract:generate
          composer analyse
          composer test

      - name: Put the change on the branch, signed
        id: commit
        if: steps.behind.outputs.moved == 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PIN: ${{ steps.behind.outputs.pin }}
          HEAD_SHA: ${{ steps.behind.outputs.head }}
          CLEAN: ${{ steps.build.outcome }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # What the sync and the generator actually wrote, rather than a list
          # kept here. A generator that starts emitting a second file would
          # otherwise have that file silently left behind, and the pull request
          # would carry half a catch-up that still fails `contract:check`.
          #
          # Tracked or not. A kind arriving is a file that did not exist
          # before, and `git diff` cannot list one — it compares the index
          # with the working tree, and an untracked file is in neither. Read
          # that way, the catch-up that brought `provenance` committed 56
          # envelopes of 57 and left `Kind` naming a class nobody could load.
          #
          # A file the sync removed is listed too: switching the contract's
          # layout removes the other one, and a definition the server drops
          # leaves its file behind it.
          changed="$(git ls-files --modified --deleted --others --exclude-standard)"
          if [ -z "$changed" ]; then
            echo "::error::the pin moved and nothing changed on disk, so there is nothing to commit"
            exit 1
          fi
          printf '%s\n' "$changed"

          # Pushed only when the push would change something. Every push moves
          # the pull request's head and runs its whole suite again, and a run
          # that regenerated exactly what the open pull request already holds
          # would spend that suite on nothing.
          #
          # Asked of the branch, not of `main`: while a pull request is open,
          # `main` still holds what it replaces, so a comparison with `main`
          # finds a change every time. What is compared is whole trees: the
          # commit the branch was built on with this run's files laid over it,
          # against the branch itself. That sees a file whose bytes differ, and
          # also a file the branch carries that this run no longer writes, which
          # comparing only the files written here would miss. A `main` that has
          # moved on since is not a difference: the pull request's diff holds
          # none of it either way.
          #
          # It says "carried" only on proof. A branch that does not exist, no
          # open pull request on it, a tree too large to list, or any call that
          # fails means a push, as does a clean build whose pull request has no
          # auto-merge armed: that is what a run cancelled between moving the
          # branch and arming it leaves, and the push is what arms it.
          if CHANGED="$changed" python3 - >"${RUNNER_TEMP}/carried" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys

          repo, branch = os.environ["REPO"], os.environ["BRANCH"]
          changed = [name for name in os.environ["CHANGED"].splitlines() if name]


          def api(path):
              done = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"pushing: {path} answered {done.stderr.strip() or done.returncode}")
              return json.loads(done.stdout)


          def blob(name):
              # The id git gives these bytes, which is what a tree records for
              # a file, so equal ids are equal bytes.
              with open(name, "rb") as handle:
                  data = handle.read()
              return hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()


          def blobs(commit):
              tree = api(f"repos/{repo}/git/trees/{commit}?recursive=1")
              if tree.get("truncated", True):
                  sys.exit(f"pushing: the tree of {commit} is too large to list whole")
              return {e["path"]: e["sha"] for e in tree["tree"] if e["type"] == "blob"}


          head = api(f"repos/{repo}/git/ref/heads/{branch}")["object"]["sha"]
          owner = repo.split("/")[0]
          pulls = [
              pull
              for pull in api(f"repos/{repo}/pulls?head={owner}:{branch}&state=open")
              if pull["head"]["ref"] == branch and pull["head"]["repo"]["full_name"] == repo
          ]
          if not pulls:
              sys.exit(f"pushing: no pull request is open on {branch}")
          pull = pulls[0]
          if os.environ["CLEAN"] == "success" and not pull.get("auto_merge"):
              sys.exit(f"pushing: #{pull['number']} has no auto-merge armed, which a clean run leaves")

          base = api(f"repos/{repo}/compare/main...{head}")["merge_base_commit"]["sha"]
          after = blobs(base)
          for name in changed:
              # A name no longer on disk is a file the sync removed, so the
              # tree this run would commit holds no such path.
              if os.path.exists(name):
                  after[name] = blob(name)
              else:
                  after.pop(name, None)
          carried = blobs(head)
          differ = sorted(p for p in after.keys() | carried.keys() if after.get(p) != carried.get(p))
          if differ:
              sys.exit(f"pushing: {len(differ)} path(s) differ from {branch}, first {', '.join(differ[:5])}")
          print(head, pull["number"])
          PY
          then
            read -r carried pull <"${RUNNER_TEMP}/carried"
            # A scratch ref a cancelled run left behind would otherwise wait for
            # the next push to clear it.
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${BRANCH}-staging" >/dev/null 2>&1 || true
            echo "carried=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::${BRANCH} already holds this at ${carried}; nothing pushed."
            {
              echo "## \`${BRANCH}\` already carries this"
              echo ""
              echo "Its head \`${carried}\` holds byte for byte what this run would commit, so nothing was pushed and #${pull} and its checks were left alone."
            } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          # `main` requires signed commits, and only commits GitHub itself makes
          # are signed here. `createCommitOnBranch` is that: it writes the files
          # and signs the result, so the branch is mergeable rather than merely
          # pushed.
          base="$(gh api "repos/${REPO}/commits/main" --jq .sha)"

          # Built on a scratch ref and moved across in one step, rather than
          # resetting the pull request's own branch to main first.
          #
          # The reset is what the branch needs — it is the bot's alone, and
          # carrying yesterday's catch-up under today's would describe two
          # changes as one — but doing it in place leaves the branch briefly
          # identical to `main`, and GitHub closes a pull request whose branch
          # holds no commits. `lemonfiber-web` lost two that way in one
          # evening: each run closed the open pull request and opened a
          # replacement, so the number changed under anyone who had commented
          # on it. Building elsewhere and moving the branch straight from
          # yesterday's commit to today's keeps it open.
          staging="${BRANCH}-staging"
          if gh api "repos/${REPO}/git/ref/heads/${staging}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${staging}" \
              -F sha="${base}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${staging}" -f sha="${base}" >/dev/null
          fi

          if [ "$CLEAN" = "success" ]; then
            body="Regenerated against the artefact; the analyser is clean and the suite passes."
          else
            body="The regeneration did not come out clean, so this is a change here rather than a catch-up. Read it before merging."
          fi

          # The request goes in a file under the runner's temporary directory,
          # not in an argument and not in the tree, where it would be one more
          # file the commit could carry. The artefact and the generated module
          # are large, and base64 of both on a command line is how a sibling
          # workflow died on `Argument list too long` — after the regeneration
          # had already succeeded, which is the worst place to fail.
          #
          # Building the JSON in Python also means the message and the file
          # contents are encoded rather than quoted into place by hand.
          CHANGED="$changed" python3 - "$REPO" "$staging" "$base" "$HEAD_SHA" "$PIN" "$body" <<'PY' >"${RUNNER_TEMP}/request.json"
          import base64
          import json
          import os
          import sys

          repo, branch, base, head, pin, note = sys.argv[1:7]
          # The list the shell read and the comparison above judged, handed
          # over rather than asked for again, so what is committed is what was
          # compared. A name no longer on disk is a file the sync removed.
          names = list(dict.fromkeys(name for name in os.environ["CHANGED"].splitlines() if name))
          deleted = [name for name in names if not os.path.exists(name)]
          changed = [name for name in names if name not in deleted]

          print(json.dumps({
              "query": (
                  "mutation($input: CreateCommitOnBranchInput!) "
                  "{ createCommitOnBranch(input: $input) { commit { oid } } }"
              ),
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": repo,
                          "branchName": branch,
                      },
                      "expectedHeadOid": base,
                      "message": {
                          "headline": f"chore(contract): take lemonfiber {head[:8]}",
                          # commitlint, dco and spec-check each read this, and
                          # spec-check closes a pull request whose citation it
                          # cannot resolve.
                          "body": (
                              f"The classes this package exports are generated from a copy of the server's contract, so a copy it has not taken is a fact about this repository. {note}\n\n"
                              f"Was {pin}.\n\n"
                              "Signed-off-by: lemonfiber release <release@lemonfiber.app>\n"
                              "Spec: Q-R68"
                          ),
                      },
                      "fileChanges": {
                          "additions": [
                              {
                                  "path": name,
                                  "contents": base64.b64encode(
                                      open(name, "rb").read()
                                  ).decode(),
                              }
                              for name in changed
                          ],
                          "deletions": [{"path": name} for name in deleted],
                      },
                  }
              },
          }))
          PY

          built="$(gh api graphql --input "${RUNNER_TEMP}/request.json" --jq '.data.createCommitOnBranch.commit.oid')"

          if ! printf '%s' "$built" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the commit was not created; got '${built}'"
            exit 1
          fi

          # One move, so the branch goes from yesterday's commit to today's
          # without ever being equal to `main`.
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
              -F sha="${built}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${built}" >/dev/null
          fi

          # The scratch ref has done its job. Left behind it would show up in
          # the branch list as something a reader has to work out.
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${staging}" >/dev/null 2>&1 || true

          echo "clean=${CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request, or leave the open one updated
        if: steps.behind.outputs.moved == 'yes' && steps.commit.outputs.carried != 'yes'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PIN: ${{ steps.behind.outputs.pin }}
          HEAD_SHA: ${{ steps.behind.outputs.head }}
          CLEAN: ${{ steps.commit.outputs.clean }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$CLEAN" = "success" ]; then
            verdict="**The analyser is clean and the suite passes.** Nothing this package exports changed shape."
          else
            verdict="**The regeneration did not come out clean.** The contract has changed a shape this package exports, so taking it is a change here rather than a catch-up. Read the failing run before merging; do not force it green."
          fi

          existing="$(gh pr list --repo "${REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            echo "::notice::#${existing} updated to ${HEAD_SHA}"
            echo "Pull request #${existing} updated." >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            created="$(gh pr create --repo "${REPO}" --head "${BRANCH}" --base main \
              --title "chore(contract): take lemonfiber ${HEAD_SHA:0:8}" \
              --body "$(printf '%s\n' \
                "\`contract-drift\` runs on every pull request here, and the vendored artefact was behind. This takes the contract so that the next author to open a pull request is not handed a sync they did not come for." \
                "" \
                "- was: \`${PIN}\`" \
                "- now: \`${HEAD_SHA}\`" \
                "" \
                "${verdict}" \
                "" \
                "Opened by \`contract-bump\`, which the server's own \`contract-moved\` fires whenever the artefact changes." \
                "" \
                "Spec: Q-R68")")"
            # `gh pr create` prints the pull request's URL, not its number.
            existing="${created##*/}"
            echo "::notice::opened #${existing}"
          fi

          # Merge itself only where the regeneration was clean. Everything else
          # is a change to what this package exports and wants a person.
          if [ "$CLEAN" = "success" ]; then
            gh pr merge "${existing}" --repo "${REPO}" --squash --auto \
              && echo "auto-merge armed on #${existing}; it lands when the gates agree." \
              || echo "::warning::could not arm auto-merge on #${existing}; merge it by hand."
          else
            echo "::warning::#${existing} needs reading: the regeneration was not clean."
          fi
