# Read by SonarQube Cloud Automatic Analysis, which is how this repository is
# scanned: `sonar.yml` runs the shared gate and no scan step of its own, so
# there is no `sonar-project.properties` for a scanner to read. That file is the
# one to add alongside a `sonarqube-scan-action` step, the way `lemonfiber` does
# it. Automatic Analysis takes the project key and organisation from the
# repository binding, so neither is set here.
#
# `tests/` is the suite `phpunit.xml` already names as one. Unnamed here,
# Automatic Analysis reads it as production source and applies the rules Sonar
# scopes to main code: the addresses `BaseUrl` is proved to refuse read as
# addresses this package connects to, and a fixture repeated across cases reads
# as a literal wanting a constant. Naming the directory leaves those rules
# pointed at `src/` and `scripts/`, where they hold.
#
# The two sets have to be disjoint — a file claimed as both source and test is
# indexed twice and the analysis produces nothing — so `tests/` is named here
# and excluded from the sources it would otherwise fall under.
sonar.sources=.
sonar.tests=tests

# `tests/**` is the exclusion that keeps the two sets apart. `src/Generated/**`
# is produced from the vendored contract artefact by `composer
# contract:generate` and rewritten whole on every run, so a finding there cannot
# be fixed where it is reported: `contract:check` regenerates the directory and
# fails on any difference, so a hand edit is undone by the next run. Pint,
# PHPStan, Rector, the guards and both test gates skip it for the same reason.
sonar.exclusions=tests/**,src/Generated/**
