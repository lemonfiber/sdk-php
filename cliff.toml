# CHANGELOG.md, generated from the commit history. Run `composer changelog`.

[changelog]
header = """
# Changelog

Generated from the commit history by [git-cliff](https://git-cliff.org) — run
`composer changelog` rather than editing this file.
"""
body = """
{% set repo = "https://github.com/lemonfiber/sdk-php" %}\
{% if version %}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | upper_first }}

{% for commit in commits %}\
- {% if commit.scope and commit.scope is matching("[a-zA-Z]") %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.breaking %} **(breaking)**{% endif %}\
{% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ repo }}/commit/{{ commit.id }})){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
# One blank line between groups and none at the end, as the markdown lint holds every page.
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }, { pattern = "\n+$", replace = "\n" }]

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true

commit_parsers = [
  { message = "^.*!:", group = "<!-- 0 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^security", group = "<!-- 4 -->Security" },
  { message = "^refactor", group = "<!-- 5 -->Refactor" },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^test", skip = true },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
]
